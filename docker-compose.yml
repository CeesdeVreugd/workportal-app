# WorkPortal – De Vreugd Productietechniek
# Portainer: Stacks > Add stack > Repository. Vul de environment variables in de Portainer-UI in.
services:
  workportal-app:
    build: .
    # Image wordt op de server zelf gebouwd; niet ophalen van Docker Hub
    pull_policy: build
    container_name: workportal-app
    restart: unless-stopped
    # Geheugengrens: een zwaar 3D-model omzetten kan dan nooit de hele VM platleggen.
    # Wordt de grens bereikt, dan stopt alleen het omzetten (WorkPortal blijft draaien).
    mem_limit: ${WP_MEM_LIMIT:-2g}
    memswap_limit: ${WP_MEM_LIMIT:-2g}
    environment:
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME:-Beheerder}
      SECRET_KEY: ${SECRET_KEY}
      # E-mail via app-registratie in Microsoft Entra ID (Microsoft Graph, Mail.Send)
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      # Alternatief: SMTP (alleen gebruikt als GRAPH_* leeg is)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
      # Komdex: sleutel voor het script dat nieuwe ordermappen doorgeeft (scripts/komdex-orders.ps1)
      KOMDEX_KEY: ${KOMDEX_KEY:-}
      # Links onder de iconen in de mailhandtekening (optioneel)
      SIGNATURE_LINKEDIN: ${SIGNATURE_LINKEDIN:-}
      SIGNATURE_YOUTUBE: ${SIGNATURE_YOUTUBE:-}
      PA_SHAREPOINT_URL: ${PA_SHAREPOINT_URL:-}
      PA_NACALC_URL: ${PA_NACALC_URL:-}
      PA_SECRET: ${PA_SECRET:-}
      # 3D: grote STEP-bestanden op de server omzetten (0 = uit), en tot welke bestandsgrootte (MB)
      WP3D_CONVERT: ${WP3D_CONVERT:-1}
      WP3D_CONVERT_MAX_MB: ${WP3D_CONVERT_MAX_MB:-150}
      TZ: Europe/Amsterdam
    volumes:
      - workportal-data:/data
    networks:
      - intern
      - npm_default

volumes:
  workportal-data:
    name: workportal-data

networks:
  intern:
    driver: bridge
  npm_default:
    external: true
