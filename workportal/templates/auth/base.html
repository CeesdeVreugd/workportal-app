<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A96">
<title>{% block title %}Inloggen{% endblock %} – WorkPortal</title>
<link rel="manifest" href="{{ url_for('manifest') }}">
<link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-192.png') }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ VERSION }}">
</head>
<body>
<main class="auth">
  <div class="auth-card">
    <img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="De Vreugd Productietechniek">
    <div class="eyebrow">WORKPORTAL</div>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="flash {{ cat if cat in ['ok','error','info'] else 'info' }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    <div class="payoff">ALS PERFORMANCE TELT</div>
  </div>
</main>
</body>
</html>
